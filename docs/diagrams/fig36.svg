<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1626"/><stop offset="1" stop-color="#0a1120"/></linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <style>
    .h{fill:#eaf1fb;font-size:19px;font-weight:bold}.title{fill:#eaf1fb;font-size:22px;font-weight:bold}
    .sub{fill:#8fa1bc;font-size:14px}.mut{fill:#6f82a0;font-size:13px}
    .ok{fill:#46c46a;font-size:15px}.bad{fill:#e5544e;font-size:15px}.warn{fill:#e0a63a;font-size:14px}
    .mono{font-family:Consolas,monospace;fill:#c7d4ea;font-size:14px}
  </style>
  <rect x="0" y="0" width="1180" height="700" rx="16" fill="url(#bg2)"/>
  <circle cx="46" cy="46" r="14" fill="#e0a63a"/>
  <text x="72" y="53" class="title">MyBoot — Recovery</text>
  <text x="1140" y="53" text-anchor="end" class="sub">a previous boot did not complete</text>
  <line x1="30" y1="78" x2="1150" y2="78" stroke="#22314f" stroke-width="1.4"/>

  <!-- diagnosis -->
  <text x="40" y="116" class="sub">Automatic diagnosis</text>
  <rect x="40" y="132" width="560" height="230" rx="12" fill="#111d31" stroke="#26375a" stroke-width="1.4"/>
  <text x="64" y="170" class="bad">✗  current Linux kernel — did not confirm (2 attempts)</text>
  <text x="64" y="204" class="ok">✓  previous Linux kernel</text>
  <text x="64" y="238" class="ok">✓  Windows 11</text>
  <text x="64" y="272" class="ok">✓  NixOS Generation 127</text>
  <text x="64" y="306" class="ok">✓  NixOS Generation 126</text>
  <rect x="64" y="322" width="512" height="26" rx="7" fill="#12331f" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="80" y="341" class="ok">Recommended →  Boot NixOS Generation 127</text>

  <!-- options -->
  <text x="40" y="404" class="sub">Other options</text>
  <g filter="url(#sh2)">
    <rect x="40"  y="420" width="270" height="48" rx="10" fill="#4c8dff"/><text x="175" y="450" text-anchor="middle" fill="#08152b" font-size="16" font-weight="bold">Boot NixOS Gen 127</text>
    <rect x="330" y="420" width="180" height="48" rx="10" fill="#16233b" stroke="#26375a"/><text x="420" y="450" text-anchor="middle" fill="#c7d4ea" font-size="15">Windows</text>
  </g>
  <rect x="40"  y="484" width="220" height="44" rx="10" fill="#16233b" stroke="#26375a"/><text x="150" y="512" text-anchor="middle" fill="#c7d4ea" font-size="15">Recovery environment</text>
  <rect x="280" y="484" width="150" height="44" rx="10" fill="#16233b" stroke="#26375a"/><text x="355" y="512" text-anchor="middle" fill="#c7d4ea" font-size="15">UEFI Shell</text>
  <rect x="450" y="484" width="150" height="44" rx="10" fill="#16233b" stroke="#26375a"/><text x="525" y="512" text-anchor="middle" fill="#c7d4ea" font-size="15">Boot EFI file…</text>

  <!-- diagnostics panel -->
  <rect x="632" y="132" width="508" height="454" rx="12" fill="#0f1a2c" stroke="#26375a" stroke-width="1.4"/>
  <text x="656" y="168" class="h">Boot diagnostics</text>
  <text x="1116" y="168" text-anchor="end" class="mut">Boot ID 9D71A2</text>
  <line x1="656" y1="182" x2="1116" y2="182" stroke="#22314f" stroke-width="1.1"/>
  <text x="656" y="214" class="mono">firmware      UEFI 2.11</text>
  <text x="656" y="242" class="mono">secure boot   ENABLED</text>
  <text x="656" y="270" class="mono">storage       NVMe0 OK · ESP OK</text>
  <text x="656" y="298" class="mono">entry         NixOS Generation 128</text>
  <text x="656" y="326" class="mono">loader        located · signature VALID</text>
  <text x="656" y="354" class="mono">kernel        located · signature VALID</text>
  <text x="656" y="382" class="mono">initrd        located</text>
  <text x="656" y="410" class="mono">handoff       ExitBootServices SUCCESS</text>
  <text x="656" y="438" class="mono" fill="#e5544e">result        OS confirmation TIMEOUT</text>
  <line x1="656" y1="458" x2="1116" y2="458" stroke="#22314f" stroke-width="1.1"/>
  <text x="656" y="490" class="mut">likely cause</text>
  <text x="656" y="514" class="mono" fill="#e0a63a">new kernel did not reach userspace</text>
  <rect x="656" y="534" width="220" height="36" rx="9" fill="#16233b" stroke="#26375a"/><text x="766" y="557" text-anchor="middle" fill="#c7d4ea" font-size="14">Export diagnostics → USB</text>
  <rect x="892" y="534" width="150" height="36" rx="9" fill="#16233b" stroke="#26375a"/><text x="967" y="557" text-anchor="middle" fill="#c7d4ea" font-size="14">Retry</text>

  <line x1="30" y1="612" x2="1150" y2="612" stroke="#22314f" stroke-width="1.4"/>
  <text x="40" y="644" class="mut">The recovery view unifies every viable fallback in one place with a single explainable recommendation, and turns an opaque failure into a structured, exportable diagnosis.</text>
</svg>
