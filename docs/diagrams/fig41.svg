<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F3864"/>
    </marker>
  </defs>
  <style>
    .lyr{fill:#F5F8FC;stroke:#B9CBE4;stroke-width:1}
    .lbl{fill:#1F3864;font-size:15px;font-weight:bold}
    .box{fill:#EAF0F8;stroke:#2E5496;stroke-width:1.5;rx:6}
    .bt{fill:#16324f;font-size:15px;text-anchor:middle}
    .bin{fill:#1F3864;stroke:#16324f;stroke-width:1.5}
    .binT{fill:#ffffff;font-size:16px;font-weight:bold;text-anchor:middle}
    .note{fill:#555;font-size:13px}
  </style>

  <!-- layer bands -->
  <rect class="lyr" x="30" y="40"  width="960" height="70"/>
  <rect class="lyr" x="30" y="130" width="960" height="70"/>
  <rect class="lyr" x="30" y="220" width="960" height="150"/>
  <rect class="lyr" x="30" y="390" width="960" height="70"/>
  <rect class="lyr" x="30" y="480" width="960" height="90"/>

  <text class="lbl" x="45" y="30">Binary</text>
  <text class="lbl" x="45" y="122">Interfaces</text>
  <text class="lbl" x="45" y="212">Engine services</text>
  <text class="lbl" x="45" y="382">Model</text>
  <text class="lbl" x="45" y="472">Foundation</text>

  <!-- binary -->
  <rect class="bin" x="470" y="55" width="200" height="42" rx="6"/>
  <text class="binT" x="570" y="82">myboot  (BOOTX64.EFI)</text>

  <!-- interfaces -->
  <rect class="box" x="180" y="145" width="200" height="42" rx="6"/><text class="bt" x="280" y="172">ui-gfx</text>
  <rect class="box" x="490" y="145" width="200" height="42" rx="6"/><text class="bt" x="590" y="172">ui-shell</text>
  <rect class="box" x="800" y="145" width="150" height="42" rx="6"/><text class="bt" x="875" y="172">host-cli</text>

  <!-- engine services -->
  <rect class="box" x="60"  y="240" width="140" height="42" rx="6"/><text class="bt" x="130" y="267">policy</text>
  <rect class="box" x="220" y="240" width="150" height="42" rx="6"/><text class="bt" x="295" y="267">transaction</text>
  <rect class="box" x="390" y="240" width="130" height="42" rx="6"/><text class="bt" x="455" y="267">config</text>
  <rect class="box" x="540" y="240" width="130" height="42" rx="6"/><text class="bt" x="605" y="267">health</text>
  <rect class="box" x="690" y="240" width="150" height="42" rx="6"/><text class="bt" x="765" y="267">discovery</text>
  <rect class="box" x="200" y="305" width="160" height="42" rx="6"/><text class="bt" x="280" y="332">providers</text>
  <rect class="box" x="560" y="305" width="150" height="42" rx="6"/><text class="bt" x="635" y="332">security</text>

  <!-- model -->
  <rect class="box" x="440" y="405" width="260" height="42" rx="6"/><text class="bt" x="570" y="432">graph  (Boot Graph)</text>

  <!-- foundation -->
  <rect class="box" x="200" y="500" width="150" height="42" rx="6"/><text class="bt" x="275" y="527">storage</text>
  <rect class="box" x="500" y="500" width="150" height="42" rx="6"/><text class="bt" x="575" y="527">persistence</text>
  <rect class="box" x="720" y="500" width="200" height="42" rx="6"/><text class="bt" x="820" y="527">platform (uefi-rs)</text>

  <!-- direction arrow -->
  <line x1="1030" y1="70" x2="1030" y2="545" stroke="#1F3864" stroke-width="2.5" marker-end="url(#arr)"/>
  <text class="note" x="1050" y="300" transform="rotate(90 1050,300)">depends on</text>

  <!-- a few representative dependency arrows (downward) -->
  <line x1="570" y1="97"  x2="570" y2="143" stroke="#8aa4c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="280" y1="187" x2="280" y2="238" stroke="#8aa4c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="590" y1="187" x2="605" y2="238" stroke="#8aa4c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="295" y1="282" x2="290" y2="303" stroke="#8aa4c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="765" y1="282" x2="640" y2="403" stroke="#8aa4c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="455" y1="282" x2="560" y2="403" stroke="#8aa4c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="570" y1="447" x2="575" y2="498" stroke="#8aa4c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="280" y1="347" x2="275" y2="498" stroke="#8aa4c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="635" y1="347" x2="800" y2="498" stroke="#8aa4c8" stroke-width="1.4" marker-end="url(#arr)"/>

  <text class="note" x="30" y="600">All dependencies point downward toward the uniform model and the firmware; no layer above the model depends on a filesystem, partition scheme or operating system.</text>
</svg>
