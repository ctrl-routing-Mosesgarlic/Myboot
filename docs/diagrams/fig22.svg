<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="m3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F3864"/></marker></defs>
<style>.b{fill:#EAF0F8;stroke:#2E5496;stroke-width:1.4}.t{fill:#16324f;font-size:13.5px;text-anchor:middle}
.h{fill:#1F3864;font-size:17px;font-weight:bold;text-anchor:middle}.e{stroke:#1F3864;stroke-width:1.6;fill:none}
.ok{fill:#EAF6EC;stroke:#2E7D32;stroke-width:1.5}.warn{fill:#FDECD9;stroke:#C55A11;stroke-width:1.5}
.dt{fill:#7a3b0f;font-size:13px;text-anchor:middle}.cap{fill:#555;font-size:13px}.mut{fill:#8a97a8;font-size:12px;text-anchor:middle}</style>
<text class="h" x="270" y="42">Existing tools — a boot selector</text>
<text class="h" x="870" y="42">MyBoot — boot management</text>
<line x1="590" y1="30" x2="590" y2="660" stroke="#c9d6e8" stroke-width="1.5" stroke-dasharray="4 4"/>
<!-- left pipeline -->
<g>
<rect class="b" x="170" y="70" width="200" height="34" rx="6"/><text class="t" x="270" y="92">scan</text>
<rect class="b" x="170" y="122" width="200" height="34" rx="6"/><text class="t" x="270" y="144">find loaders</text>
<rect class="b" x="170" y="174" width="200" height="34" rx="6"/><text class="t" x="270" y="196">show entries (flat list)</text>
<rect class="b" x="170" y="226" width="200" height="34" rx="6"/><text class="t" x="270" y="248">user chooses</text>
<rect class="b" x="170" y="278" width="200" height="34" rx="6"/><text class="t" x="270" y="300">boot</text>
<text class="mut" x="270" y="345">fire-and-forget:</text>
<text class="mut" x="270" y="362">no health, no confirmation, no rollback</text>
</g>
<g class="e" marker-end="url(#m3)"><line x1="270" y1="104" x2="270" y2="122"/><line x1="270" y1="156" x2="270" y2="174"/><line x1="270" y1="208" x2="270" y2="226"/><line x1="270" y1="260" x2="270" y2="278"/></g>
<!-- right pipeline -->
<g>
<rect class="b" x="770" y="66" width="200" height="30" rx="6"/><text class="t" x="870" y="86">discover → identify</text>
<rect class="b" x="770" y="106" width="200" height="30" rx="6"/><text class="t" x="870" y="126">validate</text>
<rect class="b" x="770" y="146" width="200" height="30" rx="6"/><text class="t" x="870" y="166">build Boot Graph</text>
<rect class="b" x="770" y="186" width="200" height="30" rx="6"/><text class="t" x="870" y="206">analyse health</text>
<rect class="b" x="770" y="226" width="200" height="30" rx="6"/><text class="t" x="870" y="246">apply policy (explainable)</text>
<rect class="b" x="770" y="266" width="200" height="30" rx="6"/><text class="t" x="870" y="286">present → select</text>
<rect class="b" x="770" y="306" width="200" height="30" rx="6"/><text class="t" x="870" y="326">stage (charge) → verify</text>
<rect class="b" x="770" y="346" width="200" height="30" rx="6"/><text class="t" x="870" y="366">boot → HANDOFF</text>
<rect class="b" x="770" y="386" width="200" height="30" rx="6"/><text class="t" x="870" y="406">confirm (success marker)</text>
</g>
<g class="e" marker-end="url(#m3)"><line x1="870" y1="96" x2="870" y2="106"/><line x1="870" y1="136" x2="870" y2="146"/><line x1="870" y1="176" x2="870" y2="186"/><line x1="870" y1="216" x2="870" y2="226"/><line x1="870" y1="256" x2="870" y2="266"/><line x1="870" y1="296" x2="870" y2="306"/><line x1="870" y1="336" x2="870" y2="346"/><line x1="870" y1="376" x2="870" y2="386"/></g>
<line class="e" x1="870" y1="416" x2="780" y2="452" marker-end="url(#m3)"/>
<line class="e" x1="870" y1="416" x2="960" y2="452" marker-end="url(#m3)"/>
<rect class="ok" x="700" y="454" width="160" height="40" rx="8"/><text class="t" x="780" y="479">COMMIT</text>
<rect class="warn" x="880" y="454" width="200" height="40" rx="8"/><text class="dt" x="980" y="472">ROLLBACK / RECOVER</text><text class="dt" x="980" y="488">(next boot)</text>
<text class="cap" x="150" y="560">Existing managers answer only “what can I boot?”. MyBoot adds the management layer above the same primitives:</text>
<text class="cap" x="150" y="580">it models health, treats each boot as a transaction, and confirms the outcome so a failed boot is rolled back rather than left to the user.</text>
</svg>
