<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F3864"/></marker></defs>
<style>.t{fill:#ffffff;font-size:15px;text-anchor:middle;font-weight:bold}.s{fill:#eef3fb;font-size:12.5px;text-anchor:middle}
