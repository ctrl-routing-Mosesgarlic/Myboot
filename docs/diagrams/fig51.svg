<line x1="1110" y1="110" x2="1110" y2="410" stroke="#1F3864" stroke-width="2" marker-start="url(#p)"/>
<text class="ax" x="1130" y="270" transform="rotate(90 1130,270)">fidelity · cost ↑</text>
<line x1="70" y1="410" x2="70" y2="110" stroke="#2E7D32" stroke-width="2" marker-end="url(#p)"/>
<text class="ax" x="52" y="270" transform="rotate(-90 52,270)" fill="#2E7D32">volume · speed ↑</text>
<text class="cap" x="120" y="470">Most defects are caught at the base, cheaply and exhaustively; each level above trades speed for fidelity. Hardware is validated last.ls pass.</text>
