<polygon points="120,420 1060,420 900,330 280,330" fill="#2E7D32"/>
<text class="t" x="590" y="378">Unit &amp; property tests + Kani proofs</text><text class="s" x="590" y="400">off-metal · milliseconds · exhaustive within input bounds</text>
<polygon points="280,325 900,325 800,240 380,240" fill="#2E5496"/>
<text class="t" x="590" y="285">Integration in QEMU + OVMF</text><text class="s" x="590" y="305">boot real operating systems in emulated firmware</text>
